[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biodiversity-pipeline"
version = "0.2.0"
description = "Plataforma modular de inteligencia de biodiversidad: GBIF + Res. 0126/2024 + IUCN + SiB Colombia, indicadores y dashboard 3D."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pygbif>=0.6.4",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "requests-cache>=1.2",
    "pillow>=10.0",
    "pyproj>=3.6",
    "pandas>=2.1",
    "numpy>=1.26",
    "rasterio>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
